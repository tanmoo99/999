<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อมูลการทำงานของพนักงาน</title>
    
    <!-- Tailwind CSS สำหรับตกแต่งความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM สำหรับการทำงานของระบบ -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel สำหรับแปลงโค้ด React ให้ทำงานบนเบราว์เซอร์ได้โดยตรง -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Google Fonts ฟอนต์สารบรรณ (Sarabun) เพื่อความเป็นทางการ -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc; /* โทนสีเทาอ่อน สุภาพทางการ */
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center text-gray-500">
                <svg class="animate-spin h-8 w-8 mx-auto mb-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p>กำลังโหลดระบบ...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // ฟังก์ชันแปลงวันที่ ISO (YYYY-MM-DD) เป็น พ.ศ. (DD/MM/YYYY)
        const formatThaiDate = (isoString) => {
            if (!isoString) return '-';
            try {
                const parts = isoString.split('-');
                if (parts.length !== 3) return isoString;
                const year = parseInt(parts[0], 10);
                const month = parts[1];
                const day = parts[2];
                const thaiYear = year + 543;
                return `${day}/${month}/${thaiYear}`;
            } catch (e) {
                return isoString;
            }
        };

        // ฟังก์ชันแปลงตัวเลขเป็นสกุลเงินบาท (เช่น 25,000.00 บาท)
        const formatCurrency = (amount) => {
            if (amount === null || amount === undefined || amount === '') return '-';
            const num = parseFloat(amount);
            if (isNaN(num)) return '-';
            return num.toLocaleString('th-TH', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' บาท';
        };

        // ฟังก์ชันสุ่ม ID
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const IconBriefcase = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;
        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconFileText = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
        const IconFilter = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>;
        const IconX = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const IconChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;

        // Modal สำหรับยืนยันการลบ
        const ConfirmDeleteModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 p-4 transition-opacity">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden">
                        <div className="p-6">
                            <div className="flex items-center justify-center w-12 h-12 mx-auto bg-red-50 rounded-full mb-4">
                                <IconTrash className="text-red-600 w-6 h-6" />
                            </div>
                            <h3 className="text-lg font-medium text-center text-gray-900 mb-2">{title}</h3>
                            <p className="text-center text-gray-500 mb-6 text-sm">{message}</p>
                            <div className="flex justify-center gap-3">
                                <button onClick={onCancel} className="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors">
                                    ยกเลิก
                                </button>
                                <button onClick={onConfirm} className="px-4 py-2 text-sm font-medium text-white bg-red-600 border border-transparent rounded hover:bg-red-700 transition-colors">
                                    ยืนยันการลบ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Modal สำหรับฟอร์มกรอกข้อมูล
        const FormModal = ({ isOpen, title, children, onSave, onCancel, isSaveDisabled }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                            <h3 className="text-lg font-medium text-gray-800">{title}</h3>
                            <button onClick={onCancel} className="text-gray-400 hover:text-gray-600 transition-colors">
                                <IconX />
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {children}
                        </div>
                        <div className="px-6 py-4 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50 transition-colors">
                                ยกเลิก
                            </button>
                            <button 
                                onClick={onSave} 
                                disabled={isSaveDisabled} 
                                className="px-4 py-2 text-sm font-medium text-white bg-[#003366] rounded hover:bg-[#002244] disabled:opacity-50 transition-colors"
                            >
                                บันทึก
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            // --- States (Mock Data สำหรับทดสอบ) ---
            const [roles, setRoles] = useState([
                { id: 'r1', name: 'ตากล้อง' },
                { id: 'r2', name: 'สวัสดิการ' },
                { id: 'r3', name: 'บัญชีและการเงิน' }
            ]);
            
            const [employees, setEmployees] = useState([
                { id: 'e1', roleId: 'r1', name: 'สมชาย รักดี' },
                { id: 'e2', roleId: 'r3', name: 'สมหญิง การบัญชี' }
            ]);
            
            const [records, setRecords] = useState([
                { id: 'rec1', employeeId: 'e1', date: '2026-10-05', amount: 12500.00, note: 'ถ่ายภาพงานอีเวนต์ประจำปี', status: 'ทำแล้ว' },
                { id: 'rec2', employeeId: 'e1', date: '2026-10-12', amount: 3000.00, note: 'ค่าเบี้ยเลี้ยงเดินทาง', status: 'ยังไม่ได้ทำ' },
                { id: 'rec3', employeeId: 'e2', date: '2026-10-01', amount: 4500.50, note: 'ค่าจัดซื้ออุปกรณ์เครื่องเขียน', status: 'ทำแล้ว' }
            ]);

            // สถานะการนำทาง
            const [viewState, setViewState] = useState({ view: 'roles', roleId: null, empId: null });

            // สถานะป๊อปอัพ (Modals)
            const [deleteConfig, setDeleteConfig] = useState({ isOpen: false, type: '', id: null, title: '', message: '' });
            const [roleModal, setRoleModal] = useState({ isOpen: false, data: null });
            const [empModal, setEmpModal] = useState({ isOpen: false, data: null });
            const [recModal, setRecModal] = useState({ isOpen: false, data: null });

            // สถานะข้อมูลในฟอร์ม (Form Inputs)
            const [roleInput, setRoleInput] = useState('');
            const [empInput, setEmpInput] = useState('');
            const [recInput, setRecInput] = useState({ date: '', amount: '', note: '', status: 'ยังไม่ได้ทำ' });

            // สถานะตัวกรอง (Filters)
            const [empSearch, setEmpSearch] = useState('');
            const [recSearch, setRecSearch] = useState('');
            const [recStatusFilter, setRecStatusFilter] = useState('ทั้งหมด');
            const [recDateFilter, setRecDateFilter] = useState('');
            const [recMinAmount, setRecMinAmount] = useState('');
            const [recMaxAmount, setRecMaxAmount] = useState('');

            // ข้อมูลอ้างอิงปัจจุบัน
            const currentRole = roles.find(r => r.id === viewState.roleId);
            const currentEmp = employees.find(e => e.id === viewState.empId);

            // ค้นหาพนักงานในตำแหน่งที่เลือก
            const displayedEmployees = useMemo(() => {
                if (!viewState.roleId) return [];
                return employees
                    .filter(e => e.roleId === viewState.roleId)
                    .filter(e => e.name.toLowerCase().includes(empSearch.toLowerCase()));
            }, [employees, viewState.roleId, empSearch]);

            // ค้นหาและกรองรายการทำงานของพนักงานที่เลือก
            const displayedRecords = useMemo(() => {
                if (!viewState.empId) return [];
                return records.filter(r => {
                    if (r.employeeId !== viewState.empId) return false;
                    
                    // กรองตามหมายเหตุ
                    if (recSearch && !r.note.toLowerCase().includes(recSearch.toLowerCase())) return false;
                    
                    // กรองตามสถานะ
                    if (recStatusFilter !== 'ทั้งหมด' && r.status !== recStatusFilter) return false;
                    
                    // กรองตามวันที่
                    if (recDateFilter && r.date !== recDateFilter) return false;
                    
                    // กรองตามจำนวนเงิน
                    const amt = parseFloat(r.amount);
                    if (recMinAmount && amt < parseFloat(recMinAmount)) return false;
                    if (recMaxAmount && amt > parseFloat(recMaxAmount)) return false;
                    
                    return true;
                }).sort((a, b) => new Date(b.date) - new Date(a.date)); // เรียงวันที่ล่าสุดขึ้นก่อน
            }, [records, viewState.empId, recSearch, recStatusFilter, recDateFilter, recMinAmount, recMaxAmount]);

            // การนำทางระหว่างหน้า
            const navToRoles = () => setViewState({ view: 'roles', roleId: null, empId: null });
            
            const navToEmps = (roleId) => { 
                setViewState({ view: 'employees', roleId, empId: null }); 
                setEmpSearch(''); 
            };
            
            const navToRecords = (empId) => { 
                setViewState({ ...viewState, view: 'records', empId }); 
                // รีเซ็ตตัวกรองเมื่อเปลี่ยนหน้า
                setRecSearch(''); setRecStatusFilter('ทั้งหมด'); setRecDateFilter(''); setRecMinAmount(''); setRecMaxAmount('');
            };

            // ตั้งค่าข้อมูลก่อนลบ
            const requestDelete = (type, item) => {
                let config = { isOpen: true, type, id: item.id };
                if (type === 'role') {
                    config.title = 'ยืนยันการลบตำแหน่งงาน';
                    config.message = `คุณแน่ใจหรือไม่ที่จะลบตำแหน่ง "${item.name}"? (ข้อมูลบุคคลและรายการทั้งหมดในตำแหน่งนี้จะถูกลบด้วย)`;
                } else if (type === 'employee') {
                    config.title = 'ยืนยันการลบบุคคล';
                    config.message = `คุณแน่ใจหรือไม่ที่จะลบข้อมูลของ "${item.name}"? (รายการจำนวนเงินทั้งหมดของบุคคลนี้จะถูกลบด้วย)`;
                } else {
                    config.title = 'ยืนยันการลบรายการ';
                    config.message = `คุณแน่ใจหรือไม่ที่จะลบรายการวันที่ ${formatThaiDate(item.date)} จำนวน ${formatCurrency(item.amount)}?`;
                }
                setDeleteConfig(config);
            };

            // ยืนยันการลบข้อมูลจริง
            const confirmDelete = () => {
                const { type, id } = deleteConfig;
                if (type === 'role') {
                    setRoles(roles.filter(r => r.id !== id));
                    // ลบพนักงานและรายการที่เกี่ยวข้อง (Cascading Delete)
                    const empIdsToDelete = employees.filter(e => e.roleId === id).map(e => e.id);
                    setEmployees(employees.filter(e => e.roleId !== id));
                    setRecords(records.filter(r => !empIdsToDelete.includes(r.employeeId)));
                } else if (type === 'employee') {
                    setEmployees(employees.filter(e => e.id !== id));
                    setRecords(records.filter(r => r.employeeId !== id));
                } else {
                    setRecords(records.filter(r => r.id !== id));
                }
                setDeleteConfig({ ...deleteConfig, isOpen: false });
            };

            // บันทึกข้อมูลตำแหน่ง (เพิ่ม/แก้ไข)
            const saveRole = () => {
                const name = roleInput.trim();
                if (!name) return;
                if (roleModal.data) {
                    // แก้ไข
                    setRoles(roles.map(r => r.id === roleModal.data.id ? { ...r, name } : r));
                } else {
                    // เพิ่มใหม่
                    setRoles([...roles, { id: generateId(), name }]);
                }
                setRoleModal({ isOpen: false, data: null });
            };

            // บันทึกข้อมูลบุคคล (เพิ่ม/แก้ไข)
            const saveEmployee = () => {
                const name = empInput.trim();
                if (!name) return;
                if (empModal.data) {
                    setEmployees(employees.map(e => e.id === empModal.data.id ? { ...e, name } : e));
                } else {
                    setEmployees([...employees, { id: generateId(), roleId: viewState.roleId, name }]);
                }
                setEmpModal({ isOpen: false, data: null });
            };

            // บันทึกรายการจำนวนเงิน (เพิ่ม/แก้ไข)
            const saveRecord = () => {
                if (!recInput.date || !recInput.amount) return;
                const newRec = { ...recInput, amount: parseFloat(recInput.amount), employeeId: viewState.empId };
                if (recModal.data) {
                    setRecords(records.map(r => r.id === recModal.data.id ? { ...newRec, id: r.id } : r));
                } else {
                    setRecords([...records, { ...newRec, id: generateId() }]);
                }
                setRecModal({ isOpen: false, data: null });
            };

            // ----------------------------------------------------
            // มุมมอง: หน้าแสดงหมวดหมู่ตำแหน่ง
            // ----------------------------------------------------
            const renderRoles = () => (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-5 rounded-lg border border-gray-200 gap-4">
                        <div>
                            <h2 className="text-xl font-medium text-[#003366] flex items-center gap-2">
                                <IconBriefcase /> โครงสร้างตำแหน่งงาน
                            </h2>
                            <p className="text-sm text-gray-500 mt-1">จัดการรายชื่อตำแหน่งภายในบริษัท</p>
                        </div>
                        <button 
                            onClick={() => { setRoleInput(''); setRoleModal({ isOpen: true, data: null }); }}
                            className="inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#003366] text-white text-sm font-medium rounded hover:bg-[#002244] transition-colors w-full sm:w-auto"
                        >
                            <IconPlus /> เพิ่มตำแหน่ง
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {roles.map(role => {
                            const count = employees.filter(e => e.roleId === role.id).length;
                            return (
                                <div key={role.id} className="bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-md transition-shadow flex flex-col">
                                    <div className="p-5 flex-1">
                                        <div className="flex justify-between items-start mb-3">
                                            <h3 className="text-lg font-medium text-gray-800 truncate pr-4">{role.name}</h3>
                                            <div className="flex gap-1">
                                                <button onClick={() => { setRoleInput(role.name); setRoleModal({ isOpen: true, data: role }); }} className="text-gray-400 hover:text-[#003366] p-1 rounded hover:bg-blue-50 transition-colors" title="แก้ไข">
                                                    <IconEdit />
                                                </button>
                                                <button onClick={() => requestDelete('role', role)} className="text-gray-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition-colors" title="ลบ">
                                                    <IconTrash />
                                                </button>
                                            </div>
                                        </div>
                                        <div className="text-sm text-gray-600 mb-4 bg-gray-50 p-2 rounded inline-flex items-center gap-2">
                                            <IconUsers /> จำนวนบุคลากร: <span className="font-medium text-gray-800">{count}</span>
                                        </div>
                                    </div>
                                    <div className="bg-gray-50 p-3 border-t border-gray-100">
                                        <button 
                                            onClick={() => navToEmps(role.id)}
                                            className="w-full inline-flex justify-center items-center gap-2 px-4 py-2 border border-gray-300 text-sm font-medium rounded text-gray-700 bg-white hover:bg-gray-100 hover:text-[#003366] transition-colors"
                                        >
                                            ดูรายชื่อบุคคล <IconChevronRight />
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                        {roles.length === 0 && (
                            <div className="col-span-full py-12 flex flex-col items-center justify-center text-gray-500 bg-white rounded-lg border border-gray-200">
                                <IconBriefcase />
                                <p className="mt-2">ยังไม่มีข้อมูลตำแหน่งในระบบ</p>
                            </div>
                        )}
                    </div>
                </div>
            );

            // ----------------------------------------------------
            // มุมมอง: หน้ารายชื่อบุคคลในตำแหน่งที่เลือก
            // ----------------------------------------------------
            const renderEmployees = () => (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-lg border border-gray-200">
                        <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4">
                            <div>
                                <h2 className="text-xl font-medium text-[#003366] flex items-center gap-2">
                                    <IconUsers /> รายชื่อบุคคล
                                </h2>
                                <p className="text-sm text-gray-600 mt-1 flex items-center">
                                    ตำแหน่ง: <span className="font-medium bg-blue-50 text-[#003366] px-2 py-0.5 rounded ml-2 border border-blue-100">{currentRole?.name}</span>
                                </p>
                            </div>
                            <div className="flex flex-col sm:flex-row items-center gap-3">
                                <div className="relative w-full sm:w-auto">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <IconSearch className="text-gray-400" />
                                    </div>
                                    <input
                                        type="text"
                                        placeholder="ค้นหาชื่อบุคคล..."
                                        value={empSearch}
                                        onChange={(e) => setEmpSearch(e.target.value)}
                                        className="pl-10 pr-4 py-2 border border-gray-300 rounded text-sm w-full sm:w-60 focus:outline-none focus:border-[#003366]"
                                    />
                                </div>
                                <button 
                                    onClick={() => { setEmpInput(''); setEmpModal({ isOpen: true, data: null }); }}
                                    className="inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#003366] text-white text-sm font-medium rounded hover:bg-[#002244] w-full sm:w-auto transition-colors whitespace-nowrap"
                                >
                                    <IconPlus /> เพิ่มบุคคล
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg border border-gray-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-16">ลำดับ</th>
                                        <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่อ - นามสกุล</th>
                                        <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-32">จำนวนรายการ</th>
                                        <th scope="col" className="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider w-56">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {displayedEmployees.map((emp, index) => {
                                        const count = records.filter(r => r.employeeId === emp.id).length;
                                        return (
                                            <tr key={emp.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{index + 1}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{emp.name}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">
                                                    {count} รายการ
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                                    <div className="flex justify-end items-center gap-2">
                                                        <button onClick={() => { setEmpInput(emp.name); setEmpModal({ isOpen: true, data: emp }); }} className="text-gray-400 hover:text-[#003366] p-1" title="แก้ไข"><IconEdit /></button>
                                                        <button onClick={() => requestDelete('employee', emp)} className="text-gray-400 hover:text-red-600 p-1" title="ลบ"><IconTrash /></button>
                                                        <button 
                                                            onClick={() => navToRecords(emp.id)}
                                                            className="inline-flex items-center px-3 py-1.5 border border-gray-300 text-xs font-medium rounded text-gray-700 bg-white hover:bg-gray-100 ml-2"
                                                        >
                                                            ข้อมูลการทำงาน <IconChevronRight className="ml-1 w-3 h-3" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {displayedEmployees.length === 0 && (
                                        <tr>
                                            <td colSpan="4" className="px-6 py-10 text-center text-gray-500">
                                                ไม่พบข้อมูลบุคคลที่ต้องการค้นหา หรือยังไม่มีรายชื่อในตำแหน่งนี้
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            // ----------------------------------------------------
            // มุมมอง: หน้ารายละเอียดและบันทึกข้อมูลการทำงานของแต่ละบุคคล
            // ----------------------------------------------------
            const renderRecords = () => (
                <div className="space-y-6">
                    {/* Header Details */}
                    <div className="bg-white p-5 rounded-lg border border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-xl font-medium text-[#003366] flex items-center gap-2 mb-2">
                                <IconFileText /> ข้อมูลการทำงานและจำนวนเงิน
                            </h2>
                            <div className="text-sm text-gray-700 bg-gray-50 p-2 rounded inline-flex flex-wrap gap-2 items-center border border-gray-200">
                                บุคคล: <span className="font-medium text-gray-900 bg-white px-2 py-0.5 rounded border border-gray-200">{currentEmp?.name}</span> 
                                <span className="text-gray-400">|</span> 
                                ตำแหน่ง: <span className="font-medium text-gray-900 bg-white px-2 py-0.5 rounded border border-gray-200">{currentRole?.name}</span>
                            </div>
                        </div>
                        <button 
                            onClick={() => { 
                                // Default วันที่ปัจจุบันของเครื่อง (YYYY-MM-DD)
                                const today = new Date().toISOString().split('T')[0];
                                setRecInput({ date: today, amount: '', note: '', status: 'ยังไม่ได้ทำ' }); 
                                setRecModal({ isOpen: true, data: null }); 
                            }}
                            className="inline-flex items-center justify-center gap-2 px-4 py-2 bg-[#003366] text-white text-sm font-medium rounded hover:bg-[#002244] transition-colors whitespace-nowrap w-full md:w-auto"
                        >
                            <IconPlus /> เพิ่มรายการข้อมูล
                        </button>
                    </div>

                    {/* Filter Section */}
                    <div className="bg-white p-4 rounded-lg border border-gray-200">
                        <div className="flex items-center gap-2 text-sm font-medium text-gray-700 mb-3 pb-2 border-b border-gray-100">
                            <IconFilter /> ค้นหาและคัดกรองรายการ
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label className="block text-xs font-medium text-gray-500 mb-1">หมายเหตุเพิ่มเติม</label>
                                <input type="text" value={recSearch} onChange={e => setRecSearch(e.target.value)} placeholder="พิมพ์ข้อความค้นหา..." className="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#003366]" />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-500 mb-1">สถานะ</label>
                                <select value={recStatusFilter} onChange={e => setRecStatusFilter(e.target.value)} className="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#003366] bg-white">
                                    <option value="ทั้งหมด">ทั้งหมด</option>
                                    <option value="ยังไม่ได้ทำ">ยังไม่ได้ทำ</option>
                                    <option value="ทำแล้ว">ทำแล้ว</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-500 mb-1">วันที่</label>
                                <input type="date" value={recDateFilter} onChange={e => setRecDateFilter(e.target.value)} className="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#003366]" />
                            </div>
                            <div className="flex gap-2">
                                <div className="flex-1">
                                    <label className="block text-xs font-medium text-gray-500 mb-1">เงิน (ต่ำสุด)</label>
                                    <input type="number" min="0" value={recMinAmount} onChange={e => setRecMinAmount(e.target.value)} placeholder="Min" className="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#003366]" />
                                </div>
                                <div className="flex-1">
                                    <label className="block text-xs font-medium text-gray-500 mb-1">เงิน (สูงสุด)</label>
                                    <input type="number" min="0" value={recMaxAmount} onChange={e => setRecMaxAmount(e.target.value)} placeholder="Max" className="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-[#003366]" />
                                </div>
                            </div>
                        </div>
                        <div className="mt-3 text-right">
                            <button 
                                onClick={() => { setRecSearch(''); setRecStatusFilter('ทั้งหมด'); setRecDateFilter(''); setRecMinAmount(''); setRecMaxAmount(''); }} 
                                className="text-xs font-medium text-gray-500 hover:text-gray-800 underline px-2 py-1"
                            >
                                ล้างการค้นหาทั้งหมด
                            </button>
                        </div>
                    </div>

                    {/* Records Table */}
                    <div className="bg-white rounded-lg border border-gray-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-[#f0f4f8]">
                                    <tr>
                                        <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-[#003366] uppercase tracking-wider w-32">วันที่ (พ.ศ.)</th>
                                        <th scope="col" className="px-6 py-3 text-left text-xs font-medium text-[#003366] uppercase tracking-wider">หมายเหตุเพิ่มเติม</th>
                                        <th scope="col" className="px-6 py-3 text-right text-xs font-medium text-[#003366] uppercase tracking-wider w-40">จำนวนเงิน</th>
                                        <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-[#003366] uppercase tracking-wider w-32">สถานะ</th>
                                        <th scope="col" className="px-6 py-3 text-center text-xs font-medium text-[#003366] uppercase tracking-wider w-24">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {displayedRecords.map((record) => (
                                        <tr key={record.id} className="hover:bg-gray-50">
                                            <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{formatThaiDate(record.date)}</td>
                                            <td className="px-6 py-4 text-sm text-gray-600">{record.note || '-'}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900 text-right">{formatCurrency(record.amount)}</td>
                                            <td className="px-6 py-4 whitespace-nowrap text-center">
                                                <span className={`px-2.5 py-1 inline-flex text-xs font-medium rounded-full ${
                                                    record.status === 'ทำแล้ว' 
                                                    ? 'bg-green-100 text-green-800' 
                                                    : 'bg-yellow-100 text-yellow-800'
                                                }`}>
                                                    {record.status}
                                                </span>
                                            </td>
                                            <td className="px-6 py-4 whitespace-nowrap text-center text-sm font-medium">
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => { setRecInput({ ...record }); setRecModal({ isOpen: true, data: record }); }} className="text-gray-400 hover:text-[#003366]" title="แก้ไข"><IconEdit /></button>
                                                    <button onClick={() => requestDelete('record', record)} className="text-gray-400 hover:text-red-600" title="ลบ"><IconTrash /></button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {displayedRecords.length === 0 && (
                                        <tr>
                                            <td colSpan="5" className="px-6 py-10 text-center text-gray-500">
                                                ไม่พบรายการข้อมูลที่ตรงกับเงื่อนไขการค้นหา
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-[#003366] border-b border-gray-200 shadow-sm sticky top-0 z-10">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center">
                            <h1 className="text-lg font-medium text-white flex items-center gap-2">
                                <IconBriefcase /> ระบบจัดการข้อมูลการทำงานของพนักงาน
                            </h1>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
                        
                        {/* Breadcrumbs Navigation */}
                        <nav className="flex text-sm font-medium text-gray-500 mb-6 bg-white p-3 rounded-lg border border-gray-200 shadow-sm overflow-x-auto" aria-label="Breadcrumb">
                            <ol className="inline-flex items-center space-x-1 md:space-x-3 whitespace-nowrap">
                                <li className="inline-flex items-center">
                                    <button onClick={navToRoles} className={`inline-flex items-center hover:text-[#003366] ${viewState.view === 'roles' ? 'text-[#003366] font-bold' : ''}`}>
                                        <IconHome className="mr-1 w-4 h-4" /> ตำแหน่งงาน
                                    </button>
                                </li>
                                {(viewState.view === 'employees' || viewState.view === 'records') && (
                                    <li>
                                        <div className="flex items-center">
                                            <IconChevronRight className="text-gray-400 mx-1" />
                                            <button onClick={() => navToEmps(viewState.roleId)} className={`hover:text-[#003366] ${viewState.view === 'employees' ? 'text-[#003366] font-bold' : ''}`}>
                                                {currentRole?.name || 'รายชื่อบุคคล'}
                                            </button>
                                        </div>
                                    </li>
                                )}
                                {viewState.view === 'records' && (
                                    <li aria-current="page">
                                        <div className="flex items-center">
                                            <IconChevronRight className="text-gray-400 mx-1" />
                                            <span className="text-gray-800 font-bold">
                                                ข้อมูลของ: {currentEmp?.name}
                                            </span>
                                        </div>
                                    </li>
                                )}
                            </ol>
                        </nav>

                        {/* Rendering Views Based on State */}
                        {viewState.view === 'roles' && renderRoles()}
                        {viewState.view === 'employees' && renderEmployees()}
                        {viewState.view === 'records' && renderRecords()}
                    </main>

                    {/* Modals Rendering */}
                    <ConfirmDeleteModal 
                        isOpen={deleteConfig.isOpen} 
                        title={deleteConfig.title} 
                        message={deleteConfig.message} 
                        onConfirm={confirmDelete} 
                        onCancel={() => setDeleteConfig({ ...deleteConfig, isOpen: false })} 
                    />

                    {/* Role Modal */}
                    <FormModal 
                        isOpen={roleModal.isOpen} 
                        title={roleModal.data ? 'แก้ไขตำแหน่งงาน' : 'เพิ่มตำแหน่งงานใหม่'} 
                        onSave={saveRole} 
                        onCancel={() => setRoleModal({ isOpen: false, data: null })}
                        isSaveDisabled={!roleInput.trim()}
                    >
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อตำแหน่งงาน <span className="text-red-500">*</span></label>
                                <input 
                                    type="text" 
                                    value={roleInput} 
                                    onChange={e => setRoleInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#003366] focus:ring-1 focus:ring-[#003366] text-sm" 
                                    placeholder="ระบุชื่อตำแหน่ง..."
                                />
                            </div>
                        </div>
                    </FormModal>

                    {/* Employee Modal */}
                    <FormModal 
                        isOpen={empModal.isOpen} 
                        title={empModal.data ? 'แก้ไขข้อมูลบุคคล' : 'เพิ่มรายชื่อบุคคลใหม่'} 
                        onSave={saveEmployee} 
                        onCancel={() => setEmpModal({ isOpen: false, data: null })}
                        isSaveDisabled={!empInput.trim()}
                    >
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">สังกัดตำแหน่ง</label>
                                <input type="text" value={currentRole?.name || ''} disabled className="w-full px-3 py-2 border border-gray-200 bg-gray-100 text-gray-500 rounded-md text-sm cursor-not-allowed" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล <span className="text-red-500">*</span></label>
                                <input 
                                    type="text" 
                                    value={empInput} 
                                    onChange={e => setEmpInput(e.target.value)}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#003366] focus:ring-1 focus:ring-[#003366] text-sm" 
                                    placeholder="ระบุชื่อและนามสกุล..."
                                />
                            </div>
                        </div>
                    </FormModal>

                    {/* Record Modal */}
                    <FormModal 
                        isOpen={recModal.isOpen} 
                        title={recModal.data ? 'แก้ไขรายการข้อมูล' : 'เพิ่มรายการข้อมูลใหม่'} 
                        onSave={saveRecord} 
                        onCancel={() => setRecModal({ isOpen: false, data: null })}
                        isSaveDisabled={!recInput.date || !recInput.amount}
                    >
                        <div className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">วันที่ <span className="text-red-500">*</span></label>
                                    <input 
                                        type="date" 
                                        value={recInput.date} 
                                        onChange={e => setRecInput({ ...recInput, date: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#003366] text-sm" 
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน (บาท) <span className="text-red-500">*</span></label>
                                    <input 
                                        type="number" 
                                        step="0.01" min="0"
                                        value={recInput.amount} 
                                        onChange={e => setRecInput({ ...recInput, amount: e.target.value })}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#003366] text-sm" 
                                        placeholder="0.00"
                                        required
                                    />
                                </div>
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">สถานะ <span className="text-red-500">*</span></label>
                                <div className="flex gap-4 p-2 border border-gray-200 rounded-md bg-gray-50">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input 
                                            type="radio" name="status" value="ยังไม่ได้ทำ" 
                                            checked={recInput.status === 'ยังไม่ได้ทำ'}
                                            onChange={e => setRecInput({ ...recInput, status: e.target.value })}
                                            className="h-4 w-4 text-[#003366] border-gray-300 cursor-pointer"
                                        />
                                        <span className="text-sm text-gray-700">ยังไม่ได้ทำ</span>
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input 
                                            type="radio" name="status" value="ทำแล้ว" 
                                            checked={recInput.status === 'ทำแล้ว'}
                                            onChange={e => setRecInput({ ...recInput, status: e.target.value })}
                                            className="h-4 w-4 text-[#003366] border-gray-300 cursor-pointer"
                                        />
                                        <span className="text-sm text-gray-700">ทำแล้ว</span>
                                    </label>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">หมายเหตุเพิ่มเติม</label>
                                <textarea 
                                    value={recInput.note} 
                                    onChange={e => setRecInput({ ...recInput, note: e.target.value })}
                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#003366] text-sm" 
                                    placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"
                                    rows="3"
                                ></textarea>
                            </div>
                        </div>
                    </FormModal>
                </div>
            );
        };

        document.addEventListener('DOMContentLoaded', () => {
            const rootElement = document.getElementById('root');
            if(rootElement) {
                const root = ReactDOM.createRoot(rootElement);
                root.render(<App />);
            }
        });
    </script>
</body>
</html>
